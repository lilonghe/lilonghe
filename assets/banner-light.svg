    <circle cx="914" cy="80" r="2.4"/>
    <circle cx="938" cy="80" r="2.4"/>
    <circle cx="890" cy="104" r="2.4"/>
    <circle cx="914" cy="104" r="2.4"/>
    <circle cx="938" cy="104" r="2.4"/>
    <circle cx="890" cy="128" r="2.4"/>
