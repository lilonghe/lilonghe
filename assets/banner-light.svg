  <text x="62" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="600" letter-spacing="-2" fill="#2B2620">Lee</text>

